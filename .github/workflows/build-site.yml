name: Build Regina's site

# Rebuilds the homepage, /books/, /series/, sitemap.xml and robots.txt from data.json.
# Runs when Regina's admin publishes data.json, when descriptions or the builder change,
# and once a day so "Coming soon" books switch to "Available now" on release day.
on:
  push:
    branches: [main]
    paths: [data.json, content/**, scripts/**, assets/site.css, .github/workflows/build-site.yml]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and commit generated pages
        run: |
          git config user.name "Regina Site Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # If another update lands while this runs, start over from the newest version instead of merging.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/build-site.mjs
            git add -A index.html books series reviews blog sitemap.xml robots.txt content/site-snapshot.json assets
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Rebuild site pages from data.json"
            git push origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          exit 1
