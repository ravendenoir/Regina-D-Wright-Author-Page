name: Build Regina's site

# Rebuilds the homepage, /books/, /series/, sitemap.xml and robots.txt from data.json.
# Runs when Regina's admin publishes data.json, when descriptions or the builder change,
# and once a day so "Coming soon" books switch to "Available now" on release day.
on:
  push:
    branches: [main]
    paths: [data.json, content/**, scripts/**, assets/site.css, .github/workflows/build-site.yml]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-site.mjs
      - name: Commit generated pages
        run: |
          git config user.name "Regina Site Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html books series reviews blog sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild site pages from data.json"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
